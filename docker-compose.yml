# Nexor v0.7 — One-command stack
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#
# Services:
#   clickhouse  — ClickHouse 24.3 (data store for all flows, metrics, audit)
#   hub-api     — Go Hub API (port 8080)
#   hub-web     — Next.js dashboard (port 3000)
#
# The agent runs on each monitored host (not in this Compose file).
# Install an agent with the one-liner shown in the hub-web Fleet dashboard.

services:

  # ── ClickHouse ───────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: nexor-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface (optional — disable in prod)
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"    # native TCP (used by hub-api)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/nexor.xml:ro
    environment:
      CLICKHOUSE_DB:       nexor
      CLICKHOUSE_USER:     nexor
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Hub API (Go) ──────────────────────────────────────────────────────────────
  hub-api:
    build:
      context: ./hub/api
      dockerfile: Dockerfile
    container_name: nexor-hub-api
    restart: unless-stopped
    ports:
      - "${HUB_API_PORT:-8080}:8080"
    environment:
      CLICKHOUSE_DSN:   "clickhouse://nexor:${CLICKHOUSE_PASSWORD}@clickhouse:9000/nexor"
      API_KEY:          "${API_KEY:?Set API_KEY in .env}"
      PRODUCTION:       "true"
      ALLOWED_ORIGINS:  "${ALLOWED_ORIGINS:-http://localhost:3000}"
      APP_URL:          "${APP_URL:-http://localhost:8080}"
      ORG_NAME:         "${ORG_NAME:-My Organisation}"
      ADMIN_EMAIL:      "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD:   "${ADMIN_PASSWORD:-}"
      # Optional — enables AI Copilot and NL Flow Search
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Optional — SMTP for email alerts
      SMTP_HOST:        "${SMTP_HOST:-}"
      SMTP_PORT:        "${SMTP_PORT:-587}"
      SMTP_USER:        "${SMTP_USER:-}"
      SMTP_PASSWORD:    "${SMTP_PASSWORD:-}"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Hub Web (Next.js) ─────────────────────────────────────────────────────────
  hub-web:
    build:
      context: ./hub/web
      dockerfile: Dockerfile
    container_name: nexor-hub-web
    restart: unless-stopped
    ports:
      - "${HUB_WEB_PORT:-3000}:3000"
    environment:
      HUB_API_URL: "http://hub-api:8080"
      HUB_API_KEY: "${API_KEY}"
      NODE_ENV:    "production"
    depends_on:
      hub-api:
        condition: service_healthy

volumes:
  clickhouse_data:
  clickhouse_logs:
